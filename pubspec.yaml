name: bank_taruna_mobile
description: Mobile company profile app for PT BPR Bank Taruna.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  smooth_page_indicator: ^1.2.0+3
  carousel_slider: ^5.1.1
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: any

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  assets:
    - assets/icons/
    - assets/images/
  uses-material-design: true
